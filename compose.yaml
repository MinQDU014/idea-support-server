services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: idea_support
      MYSQL_USER: idea_support
      MYSQL_PASSWORD: ${DB_PASSWORD:-local-db-password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-root-password}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - idea-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -u $$MYSQL_USER -e 'SELECT 1' idea_support"]
      interval: 5s
      timeout: 3s
      retries: 30
volumes:
  idea-mysql-data:
