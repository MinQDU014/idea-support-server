name: Dev Registry

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-registry-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Dev Lint and Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: idea_support_test
          MYSQL_USER: ci_user
          MYSQL_PASSWORD: ci_password
          MYSQL_ROOT_PASSWORD: ci_root_password
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      IDEA_TEST_JDBC_URL: jdbc:mysql://127.0.0.1:3306/idea_support_test?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      IDEA_TEST_DB_USER: ci_user
      IDEA_TEST_DB_PASSWORD: ci_password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - run: chmod +x ./gradlew
      - run: ./gradlew ktlintCheck test --console=plain

  publish:
    name: Push dev image to Registry
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: dev
    env:
      REGISTRY_HOST: ${{ vars.DEV_REGISTRY_HOST || 'docker.minq.live' }}
      # No team number is the instructor example; students set team1 through team8.
      REGISTRY_NAMESPACE: ${{ vars.DEV_REGISTRY_NAMESPACE || 'team' }}
      REGISTRY_USER: ${{ secrets.DEV_REGISTRY_USER }}
      REGISTRY_PASSWORD: ${{ secrets.DEV_REGISTRY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - name: Validate destination
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REGISTRY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*(:[0-9]+)?$ ]]
          [[ "$REGISTRY_NAMESPACE" =~ ^team([1-8])?$ ]]
          test -n "$REGISTRY_USER"
          test -n "$REGISTRY_PASSWORD"
          echo "CONTAINER_IMAGE=${REGISTRY_HOST}/${REGISTRY_NAMESPACE}/idea-support-server:dev-${GITHUB_SHA}" >> "$GITHUB_ENV"
      - run: chmod +x ./gradlew
      - name: Build and push dev image
        run: ./gradlew jib -PprojectDataImageTargetEnv=dev -Djib.to.tags=dev --console=plain
      - name: Show image location
        shell: bash
        run: |
          printf '### Dev image\n\n`%s`\n\nThis workflow stores the image; it does not start the application.\n' "$CONTAINER_IMAGE" >> "$GITHUB_STEP_SUMMARY"
